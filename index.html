<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Calculator</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><header><div class="eyebrow">CSE343 / WEB DEVELOPMENT</div><h1>Interactive Calculator</h1><p>Lab 3 · Basic mathematical operations</p></header><section class="card calculator" aria-label="Calculator"><div id="expression">Ready</div><output id="display" aria-live="polite">0</output><div id="keys"><button data-key="clear" class="" aria-label="Clear">AC</button><button data-key="back" class="" aria-label="Backspace">⌫</button><button data-key="sign" class="" aria-label="Change sign">±</button><button data-key="/" class="primary" aria-label="÷">÷</button><button data-key="7" class="" aria-label="7">7</button><button data-key="8" class="" aria-label="8">8</button><button data-key="9" class="" aria-label="9">9</button><button data-key="*" class="primary" aria-label="×">×</button><button data-key="4" class="" aria-label="4">4</button><button data-key="5" class="" aria-label="5">5</button><button data-key="6" class="" aria-label="6">6</button><button data-key="-" class="primary" aria-label="−">−</button><button data-key="1" class="" aria-label="1">1</button><button data-key="2" class="" aria-label="2">2</button><button data-key="3" class="" aria-label="3">3</button><button data-key="+" class="primary" aria-label="+">+</button><button data-key="0" class="" aria-label="0">0</button><button data-key="." class="" aria-label=".">.</button><button data-key="=" class="primary" aria-label="=">=</button></div><p class="hint">Keyboard: numbers, + − * /, Enter, Backspace and Escape.</p></section><footer>Ali Ali Hassan Ali Koura &nbsp; | &nbsp; 23P0126<br>Ain Shams University - Faculty of Engineering</footer></main></body></html>
